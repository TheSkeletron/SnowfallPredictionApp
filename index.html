<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" , name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snowfall Predictions</title>

  <style>
    #tab-selector-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>
  <h1>Snowfall Predictions - v1.1 (Development)</h1>

  <div id="tab-selector-container"></div>
  <div id="year-display-container"></div>

  <div id="stats-display" style="display: none;">
    <h1>
      Statistics
    </h1>
  </div>

  <template id="tab-selector-template">
    <div class="tab-selector">
      <button class="tab-selector-button">
        Text
      </button>
    </div>
  </template>

  <template id="year-display-template">
    <div class="year-display">
      <h2 class="year"></h2>
      <h3 class="date"></h3>
    </div>
  </template>

  <template id="prediction-display-template">
    <div class="prediction-display">
      <h4 class="name"></h4>
      <p class="date"></p>
      <input type="date" class="prediction-input" placeholder="Type something here..." style="display: none;" required>
      <button class="make-prediction-button" style="display: none;">
        Make Prediction
      </button>
    </div>
  </template>

  <script type="module" src="./app.js"></script>
</body>

</html>
